<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <!-- Gold gradient vertical -->
    <linearGradient id="goldGradientV" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F5D27A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft inner glow -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="256" cy="256" r="240" fill="url(#goldGradientV)" fill-opacity="0.03"/>

  <!-- Wings -->
  <g filter="url(#goldGlow)">
    <!-- Left wing -->
    <path d="M120 256 Q60 200 90 130 Q130 150 150 180 Q140 220 120 256 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5"
          class="faravahar-wing faravahar-wing-left"/>
    <!-- Right wing -->
    <path d="M392 256 Q452 200 422 130 Q382 150 362 180 Q372 220 392 256 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5"
          class="faravahar-wing faravahar-wing-right"/>
  </g>

  <!-- Central body/disc -->
  <circle cx="256" cy="256" r="60"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="2"
          filter="url(#innerGlow)"
          class="faravahar-body"/>

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="38"
          fill="none" stroke="url(#goldGradient)" stroke-width="1.5"
          stroke-dasharray="8 4"
          class="faravahar-inner-ring"/>

  <!-- Central figure (simplified human form) -->
  <g transform="translate(256, 256)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="16"
            fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5"
            class="faravahar-head"/>
    <!-- Torso -->
    <path d="M0 -34 Q-12 -10 -8 10 Q0 20 8 10 Q12 -10 0 -34 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5"
          class="faravahar-torso"/>
    <!-- Tail feathers -->
    <path d="M-10 10 Q-15 25 0 45 Q15 25 10 10 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5"
          class="faravahar-tail"/>
  </g>

  <!-- Top ring/halo -->
  <circle cx="256" cy="110" r="24"
          fill="none" stroke="url(#goldGradient)" stroke-width="2"
          stroke-dasharray="12 6"
          class="faravahar-halo"/>

  <!-- Decorative elements: small circles along wings -->
  <g fill="url(#goldGradient)" class="faravahar-accents">
    <circle cx="100" cy="170" r="4"/>
    <circle cx="115" cy="145" r="3"/>
    <circle cx="412" cy="170" r="4"/>
    <circle cx="397" cy="145" r="3"/>
    <circle cx="100" cy="340" r="3"/>
    <circle cx="412" cy="340" r="3"/>
  </g>

  <!-- Animation definitions (CSS will reference these classes) -->
  <style><![CDATA[
    .faravahar-wing-left {
      transform-origin: 150px 256px;
      animation: wingSweepLeft 4s ease-in-out infinite;
    }
    .faravahar-wing-right {
      transform-origin: 362px 256px;
      animation: wingSweepRight 4s ease-in-out infinite;
    }
    .faravahar-body {
      animation: bodyPulse 3s ease-in-out infinite;
    }
    .faravahar-halo {
      transform-origin: 256px 110px;
      animation: haloRotate 8s linear infinite;
    }
    .faravahar-inner-ring {
      transform-origin: 256px 256px;
      animation: ringRotate 12s linear infinite reverse;
    }
    .faravahar-head, .faravahar-torso, .faravahar-tail {
      transform-origin: 0 0;
      animation: figureFloat 4s ease-in-out infinite;
    }
    .faravahar-accents circle {
      animation: accentPulse 2s ease-in-out infinite;
    }
    .faravahar-accents circle:nth-child(2) { animation-delay: 0.3s; }
    .faravahar-accents circle:nth-child(3) { animation-delay: 0.6s; }
    .faravahar-accents circle:nth-child(4) { animation-delay: 0.9s; }
    .faravahar-accents circle:nth-child(5) { animation-delay: 1.2s; }
    .faravahar-accents circle:nth-child(6) { animation-delay: 1.5s; }

    @keyframes wingSweepLeft {
      0%, 100% { transform: rotate(-2deg) scaleY(1); opacity: 0.9; }
      50% { transform: rotate(3deg) scaleY(1.02); opacity: 1; }
    }
    @keyframes wingSweepRight {
      0%, 100% { transform: rotate(2deg) scaleY(1); opacity: 0.9; }
      50% { transform: rotate(-3deg) scaleY(1.02); opacity: 1; }
    }
    @keyframes bodyPulse {
      0%, 100% { transform: scale(1); filter: url(#innerGlow) drop-shadow(0 0 8px #D4AF37); }
      50% { transform: scale(1.01); filter: url(#innerGlow) drop-shadow(0 0 16px #F5D27A); }
    }
    @keyframes haloRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes figureFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes accentPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .faravahar-wing-left, .faravahar-wing-right,
      .faravahar-body, .faravahar-halo, .faravahar-inner-ring,
      .faravahar-head, .faravahar-torso, .faravahar-tail,
      .faravahar-accents circle {
        animation: none !important;
      }
    }
  ]]></style>
</svg>