<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#F5D27A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect (macOS style with larger radius) -->
  <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bgGradient)"/>

  <!-- Subtle gold border -->
  <rect x="32" y="32" width="960" height="960" rx="230" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Wings -->
  <g filter="url(#goldGlow)">
    <!-- Left wing -->
    <path d="M240 512 Q120 400 180 260 Q260 300 300 360 Q280 440 240 512 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="3"
          class="faravahar-wing faravahar-wing-left"/>
    <!-- Right wing -->
    <path d="M784 512 Q904 400 844 260 Q764 300 724 360 Q744 440 784 512 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="3"
          class="faravahar-wing faravahar-wing-right"/>
  </g>

  <!-- Central body/disc -->
  <circle cx="512" cy="512" r="120"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="4"
          filter="url(#innerGlow)"
          class="faravahar-body"/>

  <!-- Inner ring -->
  <circle cx="512" cy="512" r="76"
          fill="none" stroke="url(#goldGradient)" stroke-width="3"
          stroke-dasharray="16 8"
          class="faravahar-inner-ring"/>

  <!-- Central figure -->
  <g transform="translate(512, 512)" class="faravahar-figure">
    <!-- Head -->
    <circle cx="0" cy="-100" r="32"
            fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="3"
            class="faravahar-head"/>
    <!-- Torso -->
    <path d="M0 -68 Q-24 -20 -16 20 Q0 40 16 20 Q24 -20 0 -68 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="3"
          class="faravahar-torso"/>
    <!-- Tail feathers -->
    <path d="M-20 20 Q-30 50 0 90 Q30 50 20 20 Z"
          fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="3"
          class="faravahar-tail"/>
  </g>

  <!-- Top ring/halo -->
  <circle cx="512" cy="220" r="48"
          fill="none" stroke="url(#goldGradient)" stroke-width="4"
          stroke-dasharray="24 12"
          class="faravahar-halo"/>

  <!-- Decorative accents -->
  <g fill="url(#goldGradient)" class="faravahar-accents">
    <circle cx="200" cy="340" r="8"/>
    <circle cx="230" cy="290" r="6"/>
    <circle cx="824" cy="340" r="8"/>
    <circle cx="794" cy="290" r="6"/>
    <circle cx="200" cy="680" r="6"/>
    <circle cx="824" cy="680" r="6"/>
  </g>

  <style><![CDATA[
    .faravahar-wing-left {
      transform-origin: 300px 512px;
      animation: wingSweepLeft 4s ease-in-out infinite;
    }
    .faravahar-wing-right {
      transform-origin: 724px 512px;
      animation: wingSweepRight 4s ease-in-out infinite;
    }
    .faravahar-body {
      animation: bodyPulse 3s ease-in-out infinite;
    }
    .faravahar-halo {
      transform-origin: 512px 220px;
      animation: haloRotate 8s linear infinite;
    }
    .faravahar-inner-ring {
      transform-origin: 512px 512px;
      animation: ringRotate 12s linear infinite reverse;
    }
    .faravahar-figure {
      transform-origin: 0 0;
      animation: figureFloat 4s ease-in-out infinite;
    }
    .faravahar-accents circle {
      animation: accentPulse 2s ease-in-out infinite;
    }
    .faravahar-accents circle:nth-child(2) { animation-delay: 0.3s; }
    .faravahar-accents circle:nth-child(3) { animation-delay: 0.6s; }
    .faravahar-accents circle:nth-child(4) { animation-delay: 0.9s; }
    .faravahar-accents circle:nth-child(5) { animation-delay: 1.2s; }
    .faravahar-accents circle:nth-child(6) { animation-delay: 1.5s; }

    @keyframes wingSweepLeft {
      0%, 100% { transform: rotate(-2deg) scaleY(1); opacity: 0.9; }
      50% { transform: rotate(3deg) scaleY(1.02); opacity: 1; }
    }
    @keyframes wingSweepRight {
      0%, 100% { transform: rotate(2deg) scaleY(1); opacity: 0.9; }
      50% { transform: rotate(-3deg) scaleY(1.02); opacity: 1; }
    }
    @keyframes bodyPulse {
      0%, 100% { transform: scale(1); filter: url(#innerGlow) drop-shadow(0 0 16px #D4AF37); }
      50% { transform: scale(1.01); filter: url(#innerGlow) drop-shadow(0 0 32px #F5D27A); }
    }
    @keyframes haloRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes figureFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes accentPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      .faravahar-wing-left, .faravahar-wing-right,
      .faravahar-body, .faravahar-halo, .faravahar-inner-ring,
      .faravahar-figure, .faravahar-accents circle {
        animation: none !important;
      }
    }
  ]]></style>
</svg>